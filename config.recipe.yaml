# encoding: utf-8
---
recipe:
  Rx: config
  args:
    - schema=rime_ice
  description: >-
    Append the bilingual hint filter, switch, and settings to one schema.

patch_files:
  ${schema:-rime_ice}.custom.yaml:
    - patch/+:
        engine/filters/+:
          - lua_filter@*bilingual_hint
        switches/+:
          - name: bilingual_hint
            reset: 1
            states: [译关, 译开]
        bilingual_hint:
          zh_to_en: true
          en_to_zh: true
          translation_mode: random
          separator: " · "
